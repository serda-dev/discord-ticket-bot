## HEADS UP!
# You should read this compose file IN FULL before deploying!
# Not setting environment variables properly could cause performance/stability issues or severe security vulnerabilities!
# Read https://discordtickets.app/self-hosting/configuration so that you know what everything means! It's worth it!

version: "3.9"

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    hostname: mysql
    networks:
      - discord-tickets
    volumes:
      - tickets-mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tickets}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in Coolify}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in Coolify}
      MYSQL_USER: ${MYSQL_USER:-tickets}

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql
    restart: unless-stopped
    hostname: bot
    networks:
      - discord-tickets
    ports:
      - "${TICKETS_BIND_ADDRESS:-127.0.0.1}:8169:8169"
    volumes:
      - tickets-bot:/home/container/user
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    tty: true
    stdin_open: true
    # Please refer to the documentation:
    # https://discordtickets.app/self-hosting/configuration/#environment-variables
    environment:
      DB_CONNECTION_URL: mysql://${MYSQL_USER:-tickets}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in Coolify}@mysql/${MYSQL_DATABASE:-tickets}
      DISABLE_ENCRYPTION: "false"
      DISCORD_SECRET: ${DISCORD_SECRET:?Set DISCORD_SECRET in Coolify}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in Coolify}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in Coolify}
      DB_PROVIDER: mysql
      HTTP_EXTERNAL: ${HTTP_EXTERNAL:?Set the public HTTPS URL in Coolify}
      HTTP_HOST: 0.0.0.0
      HTTP_INTERNAL:
      HTTP_PORT: 8169
      HTTP_TRUST_PROXY: "false" # set to true if you're using a reverse proxy
      INVALIDATE_TOKENS:
      OVERRIDE_ARCHIVE: null
      PUBLIC_BOT: "false"
      PUBLISH_COMMANDS: "false"
      SUPER: ${SUPERUSER_IDS:?Set SUPERUSER_IDS in Coolify} # comma-separated Discord user IDs with global administrator access
      # IMPORTANT: You should read https://discordtickets.app/self-hosting/configuration/#super before continuing!
      
networks:
  discord-tickets:

volumes:
  tickets-mysql:
  tickets-bot:
